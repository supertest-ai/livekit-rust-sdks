# Runs the Opus padding end-to-end tests against a local LiveKit dev server.
#
# Kept in its own file rather than edited into tests.yml so that merging
# upstream main into dev never conflicts with it.

name: Fork E2E
on:
  pull_request:
    branches: ["dev"]
  push:
    branches: ["dev"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  opus-padding:
    name: Opus padding (aarch64-apple-darwin)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          submodules: true

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          rustflags: ""

      - name: Cache cargo target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target/
          key: internal-${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            internal-${{ runner.os }}-cargo-e2e-

      - name: Install Protoc
        uses: arduino/setup-protoc@a8b67ba40b37d35169e222f3bb352603327985b6 # v2.1.0
        with:
          version: "25.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run LiveKit dev server
        uses: livekit/dev-server-action@61e2b4dcb170dd3591e0c9b0db3c3fe5db93b500
        with:
          github-token: ${{ github.token }}

      - name: Unit tests
        run: |
          cargo test --release -p libwebrtc rechunker
          cargo test --release -p livekit-ffi opus_padding

      - name: End-to-end tests
        env:
          RUST_LOG: info
        run: |
          cargo test --release -p livekit --features __lk-e2e-test \
            --test opus_padding_test -- --nocapture --test-threads=1
