# Builds the FFI library for linux x86_64, linux arm64 and macOS arm64.
#
# Kept in its own file rather than edited into ffi-builds.yml so that merging
# upstream main into dev never conflicts with it. The build steps mirror the
# matching entries of ffi-builds.yml.

name: Fork FFI
on:
  pull_request:
    branches: ["dev"]
  push:
    branches: ["dev"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            build_image: sameli/manylinux_2_28_x86_64_cuda_12.3
            dylib: liblivekit_ffi.so
            target: x86_64-unknown-linux-gnu
            name: ffi-linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux
            build_image: quay.io/pypa/manylinux_2_28_aarch64
            dylib: liblivekit_ffi.so
            target: aarch64-unknown-linux-gnu
            name: ffi-linux-arm64
          - runner: macos-latest
            platform: macos
            dylib: liblivekit_ffi.dylib
            target: aarch64-apple-darwin
            macosx_deployment_target: "11.0"
            name: ffi-macos-arm64

    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          submodules: true

      - name: Setup Rust toolchain
        if: ${{ matrix.platform == 'macos' }}
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: ${{ matrix.target }}
          cache: false
          rustflags: ""

      - name: Cache cargo target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target/
          key: internal-${{ runner.os }}-cargo-target-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            internal-${{ runner.os }}-cargo-target-${{ matrix.target }}-

      - name: Install Protoc
        if: ${{ matrix.platform == 'macos' }}
        uses: arduino/setup-protoc@a8b67ba40b37d35169e222f3bb352603327985b6 # v2.1.0
        with:
          version: "25.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (macOS)
        if: ${{ matrix.platform == 'macos' }}
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx_deployment_target }}
        run: cd livekit-ffi && cargo build --release --target ${{ matrix.target }}

      # manylinux images, as upstream, so the library runs on any glibc >= 2.28.
      - name: Build (Linux)
        if: ${{ matrix.platform == 'linux' }}
        run: |
          docker run --rm -e HOST_UID=$(id -u) -e HOST_GID=$(id -g) -v $PWD:/workspace -w /workspace ${{ matrix.build_image }} bash -c "\
            set -e; \
            yum install clang clang-devel lld protobuf-compiler -y; \
            yum groupinstall 'Development Tools' -y; \
            yum install openssl-devel libX11-devel mesa-libGL-devel libXext-devel libva-devel libdrm-devel libgbm-devel libXdamage-devel libXrandr-devel libXfixes-devel libXcomposite-devel -y; \
            export LIBCLANG_PATH=/usr/lib64 CC=clang CXX=clang++; \
            curl --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y; \
            export PATH=/root/.cargo/bin:\$PATH; \
            cd livekit-ffi && cargo build --release --target ${{ matrix.target }}; \
            chown -R \$HOST_UID:\$HOST_GID /workspace/target"

      - name: Zip artifact
        run: |
          echo "# livekit" > LICENSE.md
          echo '```' >> LICENSE.md
          cat LICENSE >> LICENSE.md
          echo '```' >> LICENSE.md
          cat livekit-ffi/WEBRTC_LICENSE.md >> LICENSE.md
          out="target/${{ matrix.target }}/release"
          mv LICENSE.md "$out/"
          cp livekit-ffi/include/livekit_ffi.h "$out/"
          cd "$out" && zip "${{ github.workspace }}/${{ matrix.name }}.zip" ${{ matrix.dylib }} livekit_ffi.h LICENSE.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.zip
          retention-days: 14
